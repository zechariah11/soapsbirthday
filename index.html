<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>happy birthday ♡</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Little Sophia's birthday adventure: a whipping battle, a strawberry catch and a giant strawberry cake boss"></canvas>
  <canvas id="closeup" aria-hidden="true"></canvas>

  <section id="stageBox" class="px-box stage-box" aria-live="polite">
    <p id="stageLabel" class="stage-label"></p>
    <div id="stageRows"></div>
  </section>
  <p id="callout" class="callout" aria-live="polite"></p>

  <section id="bossBox" class="px-box boss-box" aria-live="polite">
    <div class="row"><span id="bossName" class="nm"></span><span class="lv">Lv99</span></div>
    <div class="bar-row"><span class="tag hp">HP</span><div class="bar"><i id="bossHp"></i></div></div>
  </section>

  <div class="bottom">
    <section id="playerBox" class="px-box player-box">
      <div class="row"><span id="playerName" class="nm"></span><span id="playerLv" class="lv"></span></div>
      <div class="bar-row"><span class="tag exp">EXP</span><div class="bar"><i id="playerExp"></i></div></div>
    </section>
    <section id="textBox" class="px-box text-box" aria-live="polite"><p id="textLine"></p><span class="next">▼</span></section>
  </div>

  <div id="envelopeWrap" class="envelope-wrap">
    <button id="envelope" class="envelope" aria-label="open your letter"><canvas id="envCanvas" width="34" height="36"></canvas></button>
    <p class="px-box env-caption">▶ TAP TO OPEN</p>
  </div>

  <div id="letter" class="letter-overlay">
    <article id="dialog" class="px-box dialog">
      <button id="closeLetter" class="x-btn" aria-label="close letter">✕</button>
      <p class="dialog-tag">★ A LETTER FOR <span class="name-slot"></span> ★</p>
      <div id="song" class="song" hidden>
        <div id="songEmbed"></div>
        <button id="songBtn" class="px-btn ghost song-btn" hidden>❚❚ PAUSE OUR SONG</button>
      </div>
      <h2 id="greeting"></h2>
      <div id="letterBody" class="letter-body"></div>
      <p class="sign"><span id="signOff"></span><br><b id="from"></b></p>
      <div class="dialog-btns">
        <button id="skip" class="px-btn ghost">▶▶ SHOW ALL</button>
        <button id="replay" class="px-btn">↺ PLAY AGAIN</button>
      </div>
    </article>
  </div>

  <div id="wrong" class="letter-overlay wrong-overlay">
    <article id="wrongPaper" class="paper">
      <div id="wrongContent"></div>
      <div id="stamp" class="stamp"></div>
      <button id="wrongNext" class="px-btn ghost wrong-next">…?</button>
    </article>
  </div>

  <div id="intro" class="intro">
    <div class="px-box intro-card">
      <p class="eyebrow">★ PLAYER 1 ★</p>
      <canvas id="preview" class="preview" width="40" height="46"></canvas>
      <h1><span class="name-slot"></span>'s<br>birthday</h1>
      <p id="startText" class="intro-text"></p>
      <button id="start" class="px-btn start" disabled>LOADING…</button>
      <p id="notice" class="notice" hidden></p>
    </div>
  </div>

  <div id="stageCard" class="stage-card">
    <div class="px-box stage-card-box">
      <p id="cardNum" class="eyebrow"></p>
      <h2 id="cardTitle"></h2>
      <p id="cardStars" class="card-stars"></p>
      <p id="cardHow" class="card-how"></p>
    </div>
  </div>

  <button id="mute" class="px-box mute" aria-label="toggle sound">♪</button>
  <div id="flash" class="flash"></div>

  <script src="js/art.js"></script>
  <script src="js/music.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

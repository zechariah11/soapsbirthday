<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>happy birthday ♡</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hud">
    <div class="px-box hp">
      <p id="cakeName" class="hp-label"></p>
      <div id="hpBar" class="hp-bar"></div>
    </div>
  </div>

  <p id="hint" class="px-box hint"></p>

  <div id="envelopeWrap" class="envelope-wrap">
    <button id="envelope" class="envelope" aria-label="open your letter"><canvas id="envCanvas" width="32" height="34"></canvas></button>
    <p class="px-box env-caption">▶ A LETTER FOR YOU</p>
  </div>

  <div id="letter" class="letter-overlay">
    <article id="dialog" class="px-box dialog">
      <p class="dialog-tag">★ FOR <span data-name></span> ★</p>
      <h2>Dear <span data-name></span>,</h2>
      <div id="letterBody" class="letter-body"></div>
      <p id="sign" class="sign">love, <br><span id="from"></span></p>
      <span id="more" class="more">▼</span>
      <div id="dialogBtns" class="dialog-btns">
        <button id="replay" class="px-btn">▶ PLAY AGAIN</button>
        <button id="closeLetter" class="px-btn ghost">✕ CLOSE</button>
      </div>
    </article>
  </div>

  <div id="intro" class="intro">
    <div class="px-box intro-card">
      <p class="eyebrow">★ PLAYER 1 ★</p>
      <canvas id="preview" class="preview" width="60" height="110"></canvas>
      <h1><span data-name></span>'s<br>birthday</h1>
      <p id="introText" class="intro-text"></p>
      <button id="start" class="px-btn start">▶ PRESS START</button>
    </div>
  </div>

  <button id="mute" class="px-box mute" aria-label="toggle sound">♪</button>
  <div id="flash" class="flash"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
